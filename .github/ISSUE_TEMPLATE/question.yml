name: Question
description: Ask anything that is unclear about the project, its usage, or its documentation. Please provide as much detail as possible.
title: "[Question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to ask this question!
  - type: textarea
    id: question
    attributes:
      label: What is your question?
      description: Please describe your question in as much detail as possible. You can attach screenshots and logs, if you have any.
      placeholder: Tell us what you want to know!
      value: "I have a question!"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of our software are you running?
    validations:
      required: false
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Sanity Checks
      description: Please check all that apply. If you haven't done these, please do them before submitting the issue.
      options:
        - label: I looked through the documentation and did not find a satisfactory answer there.
          required: true
        - label: I searched for existing issues (open or closed) and did not find a duplicate.
          required: true
        - label: I made sure not to disclose any sensitive information in this issue description or in any attached logs / screenshots.
          required: true
