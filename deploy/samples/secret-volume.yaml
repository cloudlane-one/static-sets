# A Secret mounted as files, which is the only way to give a static Pod Secret
# material without disclosing it.
#
# A static Pod has no offline way to resolve secretKeyRef: either the value is
# written into the manifest (where the mirror Pod exposes it) or the variable is
# absent after a reboot. So Secret material is materialized as a mode-restricted
# file inside the revision directory and mounted read-only, and this sample states
# the file mode explicitly.
apiVersion: v1
kind: Secret
metadata:
  name: web-tls
  namespace: static-sets
type: Opaque
stringData:
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    placeholder
    -----END PRIVATE KEY-----
---
apiVersion: staticsets.cloudlane.dev/v1
kind: StaticSet
metadata:
  name: web-tls
  namespace: static-sets
spec:
  mode: Deployment
  replicas: 1
  template:
    spec:
      containers:
        - name: web
          image: registry.example.com/web:1.27
          imagePullPolicy: IfNotPresent
          # Declaring the container as root is what lets the installer write the
          # Secret files as 0400 and still have them be readable. A non-root
          # container must state its own mode instead.
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: tls
              mountPath: /etc/web/tls
      volumes:
        - name: tls
          secret:
            secretName: web-tls
            defaultMode: 256
  installer:
    image: ghcr.io/cloudlane-one/static-sets:0.1.0
