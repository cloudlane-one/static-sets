# A StaticSet in Deployment mode: two placements, wherever the scheduler puts them.
#
# The controller asks the scheduler by creating a scheduling probe, a ReplicaSet whose
# Pods carry the resources and placement rules below. The Pods are bound to nodes and
# never start: they run under a RuntimeClass no container runtime implements. Each
# node whose Pod was bound then gets the real static Pod, and the probe is deleted.
#
# Apply the referenced configuration first (see configmap.yaml).
apiVersion: staticsets.cloudlane.dev/v1
kind: StaticSet
metadata:
  name: web
  namespace: static-sets
spec:
  mode: Deployment
  replicas: 2

  # Placement steers the *scheduler*, which places the probe Pods. It is not copied
  # onto the emitted static workload, because kubelet never schedules a static Pod: it
  # starts the file it finds, on the node whose kubelet finds it.
  placement:
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
      - key: node-role.kubernetes.io/edge
        operator: Exists
        effect: NoSchedule

  # The workload template. Only the supported subset is accepted; anything that
  # would need the API server or the scheduler is refused rather than dropped.
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: registry.example.com/web:1.27
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/web/app.conf"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GREETING
              valueFrom:
                configMapKeyRef:
                  name: web-conf
                  key: app.conf
          envFrom:
            - configMapRef:
                name: web-conf
          volumeMounts:
            - name: conf
              mountPath: /etc/web
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: conf
          configMap:
            name: web-conf

  update:
    # Recreate is the conservative default: the old static Pod is removed before the
    # new one is written, so a node never holds two revisions of the same StaticSet at
    # once. Surge writes the new one first and retires the old one once the new Pod is
    # observed running.
    strategy: Recreate

  offline:
    retainedRevisions: 2

