{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "static-sets.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "static-sets.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "static-sets.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: {{ .Values.webhook.port }}
      targetPort: webhook
      protocol: TCP
{{- end }}
