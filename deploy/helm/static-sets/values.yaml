# Defaults of the StaticSet operator chart.
#
# The chart installs three things: the controller (one cluster-wide Deployment), the
# node manager (a DaemonSet, one Pod per node, which writes the static Pods), and the
# placeholder RuntimeClass the scheduling probes ask for.
#
# The controller is cluster-wide because a StaticSet may live in any namespace: the
# node that has to serve a placement is named by the placement, not by where the
# StaticSet happens to be.

replicaCount: 1

image:
  repository: ghcr.io/cloudlane-one/static-sets
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# The node manager. It runs once per node, mounts kubelet's static Pod directory and
# the bundle directory, and serves every StaticSet placed on its node, in every
# namespace. Its host access is the same for every StaticSet: a StaticSet cannot widen
# it.
manager:
  # Defaults to the operator image: the two entry points share the library, and
  # shipping them together removes any chance of their revision hashing or ownership
  # protocol disagreeing.
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  # kubelet's staticPodPath on the node.
  staticPodPath: /etc/kubernetes/manifests
  # The persistent directory the manager owns: ownership records, revision
  # directories and materialized configuration.
  bundleDir: /var/lib/static-sets
  serviceAccountName: ""
  updateStrategy: RollingUpdate
  resources: {}
  # A placement can be asked for on any node, so the manager has to run on any node,
  # including a cordoned or tainted one.
  tolerations:
    - operator: Exists
  nodeSelector: {}
  podLabels: {}
  podAnnotations: {}

# The scheduling probe.
#
# The controller asks the Kubernetes scheduler where a workload should run by creating
# a ReplicaSet or a DaemonSet whose Pods carry the workload's resource requests and the
# StaticSet's placement rules. Those Pods must be scheduled and must never execute,
# which is what this RuntimeClass is for: no container runtime implements the handler,
# so kubelet binds the Pod, fails to create its sandbox, and starts nothing.
#
# It is created by the chart rather than by the operator because it is cluster-scoped
# and carries no per-StaticSet content. It must not be renamed without also changing
# the controller's STATIC_SETS_PROBE_RUNTIME_CLASS.
probe:
  runtimeClassName: staticsets-scheduling-probe
  createRuntimeClass: true

# Strict admission validation of StaticSets.
#
# The generated CRD is a structural schema, so the API server *prunes* an unknown
# field instead of refusing it. Turning the webhook on makes such an object a
# rejection instead of a silent drop. It needs cert-manager to issue the serving
# certificate, so it is off by default; with it off, unknown template fields are
# pruned silently by the API server.
webhook:
  enabled: false
  port: 8443
  failurePolicy: Fail
  certManager:
    createIssuer: true
    issuerRef:
      name: ""
      kind: Issuer

rbac:
  create: true

podLabels: {}
podAnnotations: {}

# The controller only ever reconciles through the API; it mounts no host path and
# needs no privilege.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

podSecurityContext: {}

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
