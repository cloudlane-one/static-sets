                                    maximum: 65535
                                    minimum: 1
                                    title: Containerport
                                    type: integer
                                  hostPort:
                                    title: Hostport
                                    type: integer
                                    nullable: true
                                  hostIP:
                                    title: Hostip
                                    type: string
                                    nullable: true
                                  name:
