                                    description: "ResourceClaim references one entry\
                                      \ in PodSpec.ResourceClaims.\n\nAttributes:\n\
                                      \  openapi_types (dict): The key is attribute\
                                      \ name\n                        and the value\
                                      \ is attribute type.\n  attribute_map (dict):\
                                      \ The key is attribute name\n              \
                                      \          and the value is json key in definition."
