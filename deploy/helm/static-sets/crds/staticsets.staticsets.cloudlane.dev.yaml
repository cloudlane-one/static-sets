apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: staticsets.staticsets.cloudlane.dev
spec:
  group: staticsets.cloudlane.dev
  scope: Namespaced
  names:
    plural: staticsets
    kind: StaticSet
    listKind: StaticSetList
    singular: staticset
    shortNames:
    - sset
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: A namespaced set of static Pods, placed by the scheduler and
          written per node.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: What a user asks for.
            properties:
              mode:
                description: How many placements the operator asks the scheduler for.
                enum:
                - Deployment
                - DaemonSet
                title: Mode
                type: string
              replicas:
                title: Replicas
                maximum: 64
                minimum: 0
                type: integer
                nullable: true
              template:
                description: A ``PodTemplateSpec`` restricted to the supported subset.
                properties:
                  metadata:
                    description: The subset of Pod metadata the operator carries onto
                      the static Pod.
                    properties:
                      labels:
                        title: Labels
                        additionalProperties:
                          type: string
                        type: object
                        nullable: true
                      annotations:
                        title: Annotations
                        additionalProperties:
                          type: string
                        type: object
                        nullable: true
                    title: TemplateMeta
                    type: object
                    nullable: true
                  spec:
                    description: The workload Pod specification this operator can
                      compile.
                    properties:
                      containers:
                        items:
                          description: A container from the supported subset of the
                            workload API.
                          properties:
                            name:
                              minLength: 1
                              title: Name
                              type: string
                            image:
                              minLength: 1
                              title: Image
                              type: string
                            imagePullPolicy:
                              description: 'Supported ``imagePullPolicy`` values.


                                ``Never`` is the only policy that is safe on a disconnected
                                host, because it

                                never contacts a registry. ``IfNotPresent`` is the
                                default and is safe as long

                                as the image is already present.'
                              enum:
                              - Always
                              - IfNotPresent
                              - Never
                              title: PullPolicy
                              type: string
                              nullable: true
                            command:
                              title: Command
                              items:
                                type: string
                              type: array
                              nullable: true
                            args:
                              title: Args
                              items:
                                type: string
                              type: array
                              nullable: true
                            workingDir:
                              title: Workingdir
                              type: string
                              nullable: true
                            env:
                              title: Env
                              items:
                                description: 'A container environment variable.


                                  The name is constrained to the C identifier form
                                  Kubernetes requires, so an

                                  unusable name is refused here rather than producing
                                  a manifest kubelet rejects.'
