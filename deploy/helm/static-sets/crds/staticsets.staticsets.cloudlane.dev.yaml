                              description: 'Container resource requests and limits,
                                from the official Kubernetes type.


                                ``claims`` belongs to the scheduler, which never sees
                                a static Pod: kubelet

                                starts it from a file and cannot resolve a claim.
                                It is refused rather than

                                written into a manifest that would silently never
                                take effect.'
