                                  name:
                                    minLength: 1
                                    pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                                    title: Name
                                    type: string
                                  value:
                                    title: Value
                                    type: string
                                    nullable: true
                                  valueFrom:
                                    description: 'Sources a single environment variable.


                                      Only ``configMapKeyRef`` and ``secretKeyRef``
                                      are supported; ``fieldRef`` and

                                      ``resourceFieldRef`` are rejected by the unknown-field
                                      rule.'
