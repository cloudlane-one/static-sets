                            the value. Valid operators are Exists, Equal, Lt, and
                            Gt. Defaults to Equal. Exists is equivalent to wildcard
                            for value, so that a pod can tolerate all taints of a
                            particular category. Lt and Gt perform numeric comparisons
                            (requires feature gate TaintTolerationComparisonOperators).
