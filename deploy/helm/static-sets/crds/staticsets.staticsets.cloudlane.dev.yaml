              placement:
                description: 'Where the operator may schedule installers.


                  These settings steer the *scheduler*, which places installer Pods.
                  They are

                  not copied onto the emitted static workload, because kubelet never
                  schedules a

                  static Pod: it starts the file it finds on the node whose kubelet
                  finds it.


                  The field types are the official Kubernetes ones, so the CRD documents
                  the

                  scheduler API faithfully; the validator below refuses the parts
                  this operator

                  does not act on, rather than accepting them and quietly ignoring
                  them.'
                properties:
                  nodeSelector:
                    title: Nodeselector
                    additionalProperties:
                      type: string
                    type: object
                    nullable: true
                  affinity:
                    description: "Affinity is a group of affinity scheduling rules.\n\
                      \nAttributes:\n  openapi_types (dict): The key is attribute\
                      \ name\n                        and the value is attribute type.\n\
                      \  attribute_map (dict): The key is attribute name\n       \
                      \                 and the value is json key in definition."
                    properties:
                      nodeAffinity:
                        description: "Node affinity is a group of node affinity scheduling\
                          \ rules.\n\nAttributes:\n  openapi_types (dict): The key\
                          \ is attribute name\n                        and the value\
                          \ is attribute type.\n  attribute_map (dict): The key is\
                          \ attribute name\n                        and the value\
                          \ is json key in definition."
                        properties:
                          preferredDuringSchedulingIgnoredDuringExecution:
                            description: The scheduler will prefer to schedule pods
                              to nodes that satisfy the affinity expressions specified
                              by this field, but it may choose a node that violates
                              one or more of the expressions. The node that is most
                              preferred is the one with the greatest sum of weights,
                              i.e. for each node that meets all of the scheduling
                              requirements (resource request, requiredDuringScheduling
                              affinity expressions, etc.), compute a sum by iterating
                              through the elements of this field and adding "weight"
                              to the sum if the node matches the corresponding matchExpressions;
                              the node(s) with the highest sum are the most preferred.
                            title: Preferredduringschedulingignoredduringexecution
                            items:
                              description: "An empty preferred scheduling term matches\
                                \ all objects with implicit weight 0 (i.e. it's a\
                                \ no-op). A null preferred scheduling term matches\
                                \ no objects (i.e. is also a no-op).\n\nAttributes:\n\
                                \  openapi_types (dict): The key is attribute name\n\
                                \                        and the value is attribute\
                                \ type.\n  attribute_map (dict): The key is attribute\
                                \ name\n                        and the value is json\
                                \ key in definition."
                              properties:
                                preference:
                                  description: "A null or empty node selector term\
                                    \ matches no objects. The requirements of them\
                                    \ are ANDed. The TopologySelectorTerm type implements\
                                    \ a subset of the NodeSelectorTerm.\n\nAttributes:\n\
                                    \  openapi_types (dict): The key is attribute\
                                    \ name\n                        and the value\
                                    \ is attribute type.\n  attribute_map (dict):\
                                    \ The key is attribute name\n                \
                                    \        and the value is json key in definition."
                                  properties:
                                    matchExpressions:
                                      description: A list of node selector requirements
                                        by node's labels.
                                      title: Matchexpressions
                                      items:
                                        description: "A node selector requirement\
                                          \ is a selector that contains values, a\
                                          \ key, and an operator that relates the\
                                          \ key and values.\n\nAttributes:\n  openapi_types\
                                          \ (dict): The key is attribute name\n  \
                                          \                      and the value is\
                                          \ attribute type.\n  attribute_map (dict):\
                                          \ The key is attribute name\n          \
                                          \              and the value is json key\
                                          \ in definition."
                                        properties:
                                          key:
                                            description: The label key that the selector
                                              applies to.
                                            title: Key
                                            type: string
