# GitLab CI equivalent of the GitHub Actions workflows in .github/workflows/
# - checks.yml  -> `checks`, `image-smoke` and `end-to-end` jobs
# - release.yml -> `release` job (semantic-release version + PyPI dist build/publish)
# - pages.yml   -> `pages` job (docs deployment via GitLab Pages instead of `gh-deploy`)

workflow:
  # Mirror the GitHub triggers: run pipelines on merge requests and pushes to the default branch
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - release
  - deploy

default:
  # Python 3.13 + uv in one image, equivalent to astral-sh/setup-uv.
  # NOTE: the non-slim variant is required because the slim image has no git,
  # which semantic-release and uv-dynamic-versioning (git-tag-based versioning) need.
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  # Cache the uv package cache and the mkdocs-material cache between runs
  # (latter is the equivalent of the weekly ~/.cache cache in pages.yml)
  cache:
    key: uv-cache
    paths:
      - .uv-cache/
      - .cache/

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: "copy"
  XDG_CACHE_HOME: "$CI_PROJECT_DIR/.cache"

checks:
  stage: check
  before_script:
    # Helm is needed by tests/app/test_manifests.py, which renders the chart.
    - apt-get update && apt-get install -y --no-install-recommends curl
    - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  script:
    - uv sync --python 3.13 --group ci
    - uv run ruff check .
    - uv run pyright .
    # The library and the entry points must stay above the 90 % bar.
    - uv run pytest tests --cov=src --cov=app --cov-report=term-missing --cov-fail-under=90
    - uv run vtr build-docs
    - uv run vtr assert-license-compliance
    - uv run vtr assert-no-vulnerabilities
    - uv run vtr assert-no-deptry-issues

image-smoke:
  stage: check
  # Builds deploy/Dockerfile and runs both entry points inside it. Needs a runner
  # with a Docker daemon available to the job.
  script:
    - uv sync --python 3.13 --group ci
    - STATIC_SETS_IMAGE_SMOKE=1 uv run pytest tests/test_image_smoke.py -v

end-to-end:
  stage: check
  # Needs a cluster. On a runner with a Docker daemon, create a throwaway kind
  # cluster first (the GitHub pipeline does this with helm/kind-action):
  #
  #   kind create cluster --image kindest/node:v1.31.14
  #
  # then set STATIC_SETS_K8S_INTEGRATION and run the suite.
  rules:
    - if: $STATIC_SETS_K8S_INTEGRATION == "1"
  script:
    - uv sync --python 3.13 --group ci
    - uv run pytest tests/test_e2e.py -v

release:
  stage: release
  # Run immediately, independent of `checks` (mirrors the separate GitHub workflow)
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: "0" # full clone, equivalent of fetch-depth: 0
    # python-semantic-release uses GL_TOKEN to create GitLab releases.
    # Define a masked CI/CD variable `GL_TOKEN` (project access token with `api` scope).
  script:
    - git config user.name "gitlab-ci[bot]"
    - git config user.email "gitlab-ci@users.noreply.${CI_SERVER_HOST}"
    - uv sync --group ci
    - uv run semantic-release version --skip-build --no-commit
    - uv build --out-dir ./dist/pypi
    - uv run semantic-release publish

pages:
  stage: deploy
  # Run immediately, independent of `checks` (mirrors the separate GitHub workflow)
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    SITE_URL: "$CI_PAGES_URL" # consumed by `site_url: !ENV SITE_URL` in docs/.config.yml
  script:
    - uv sync --group ci
    - uv run properdocs build -f ./docs/.config.yml
    # GitLab Pages serves a `public` artifact instead of pushing to a `gh-pages` branch
    - cp --recursive dist/docs public
  artifacts:
    paths:
      - public